<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Test for CSCA — bilingual print</title>
<link rel="stylesheet" href="../css/fonts.css">
<link rel="stylesheet" href="../css/fonts-km.css">
<style>
  @page { size: A4; margin: 14mm 14mm 16mm; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "IBM Plex Sans", "Kantumruy Pro", system-ui, sans-serif; font-size: 10.3pt; line-height: 1.5; color: #111; }
  .km { font-family: "Kantumruy Pro", "IBM Plex Sans", sans-serif; line-height: 1.8; }
  .label { font-weight: 600; color: #555; margin-right: 4px; }
  .label.kl { color: #2446a6; }
  h1, h2, h3 { line-height: 1.3; margin: 0; }
  .accent { color: #c8472e; }
  mjx-container { font-size: 105% !important; }
  /* cover / headers */
  header.cover { border: 1.5px solid #c8472e; border-radius: 4px; padding: 10px 14px; margin-bottom: 10px; }
  header.cover h1 { font-family: "IBM Plex Sans Condensed", sans-serif; font-size: 18pt; }
  header.cover .kmt { font-size: 13pt; font-weight: 700; color: #2446a6; }
  .meta { display: flex; gap: 14px; flex-wrap: wrap; color: #c8472e; font-family: "IBM Plex Mono", "Kantumruy Pro", monospace; font-size: 8.3pt; margin-top: 4px; }
  .fields { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 16px; margin-top: 12px; font-size: 9.3pt; }
  .fields span { border-bottom: 1px solid #888; padding-bottom: 3px; }
  .instr { font-size: 8.8pt; margin: 0 0 6px; padding-left: 16px; }
  .instr li { margin: 1px 0; }
  h2.part { font-size: 12pt; border-bottom: 1.5px solid #222; padding-bottom: 3px; margin: 12px 0 4px; break-after: avoid; }
  h2.part .km { font-size: 10.5pt; color: #2446a6; font-weight: 700; }
  /* question */
  .q { break-inside: avoid; padding: 6px 0 8px; border-bottom: 1px dotted #ccc; }
  .qn { font-weight: 700; font-size: 10.5pt; }
  .q p { margin: 1px 0; }
  .q .km { color: #222; }
  .choices { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px 14px; padding-left: 18px; margin-top: 3px; }
  .choices.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .choices.one { grid-template-columns: minmax(0, 1fr); }
  .choices b { font-family: "IBM Plex Mono", monospace; margin-right: 4px; }
  .choices .ckm { display: block; font-size: 9pt; color: #2446a6; padding-left: 20px; }
  /* answer sheet */
  .sheet { break-before: page; }
  .sheet h2 { font-family: "IBM Plex Sans Condensed", sans-serif; font-size: 15pt; }
  .bubbles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 26px; border: 1.5px solid #c8472e; border-radius: 4px; padding: 10px 14px; margin-top: 10px; }
  .brow { display: flex; align-items: center; gap: 7px; padding: 3.2px 0; border-bottom: 1px dashed #f0c4b8; }
  .brow .n { width: 22px; text-align: right; font-family: "IBM Plex Mono", monospace; font-size: 9pt; color: #c8472e; }
  .brow i { width: 17px; height: 17px; border: 1.3px solid #c8472e; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-style: normal; font-family: "IBM Plex Mono", monospace; font-size: 7.5pt; color: #c8472e; }
  .scorebox { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; font-size: 9pt; }
  .scorebox div { border: 1px solid #999; border-radius: 3px; padding: 6px 8px; min-height: 44px; }
  /* answer key */
  .key { break-before: page; }
  .key h2 { font-family: "IBM Plex Sans Condensed", sans-serif; font-size: 15pt; margin-bottom: 6px; }
  .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; margin: 6px 0 8px; }
  .grid div { border: 1px solid #bbb; border-radius: 3px; text-align: center; font-family: "IBM Plex Mono", monospace; font-size: 9pt; padding: 2px 0; }
  .grid div b { color: #c8472e; margin-left: 4px; }
  .grid.ten { grid-template-columns: repeat(10, 1fr); }
  .sol { break-inside: avoid; font-size: 9.2pt; padding: 4px 0; border-bottom: 1px dotted #ccc; }
  .sol .ans { font-family: "IBM Plex Mono", monospace; font-weight: 700; color: #c8472e; }
  .scale { font-size: 8.6pt; color: #333; margin: 0 0 8px; }
  /* lessons */
  .lesson { break-before: page; }
  .lesson:first-of-type { break-before: auto; }
  .lesson-head { border-bottom: 2px solid #2446a6; padding-bottom: 6px; margin-bottom: 8px; }
  .lesson-head .num { font-family: "IBM Plex Mono", monospace; color: #c8472e; font-size: 9pt; letter-spacing: .05em; }
  .lesson-head h1 { font-family: "IBM Plex Sans Condensed", sans-serif; font-size: 19pt; }
  .lesson-head .kmt { font-size: 14pt; font-weight: 700; color: #2446a6; }
  .syl { font-size: 8.8pt; background: #f3f5fa; border-left: 3px solid #2446a6; padding: 5px 9px; margin: 6px 0 8px; }
  .pair { break-inside: avoid; margin: 8px 0 10px; }
  .pair h3 { font-size: 11.5pt; margin-bottom: 2px; }
  .en-part ul, .km-part ul { margin: 3px 0; padding-left: 20px; }
  .en-part li, .km-part li { margin: 2px 0; }
  .en-part p, .km-part p { margin: 3px 0; }
  .km-part { background: #f3f5fa; border-radius: 4px; padding: 6px 10px; margin-top: 4px; }
  .km-part h3 { font-size: 10.8pt; color: #2446a6; }
  table.mini { border-collapse: collapse; margin: 4px 0; font-size: 9.5pt; }
  table.mini th, table.mini td { border: 1px solid #ccc; padding: 3px 7px; text-align: left; }
  .scroll { overflow: visible; }
  .vocab { width: 100%; border-collapse: collapse; font-size: 9.3pt; margin-top: 4px; }
  .vocab th, .vocab td { border: 1px solid #ccc; padding: 3px 7px; text-align: left; vertical-align: top; }
  .vocab th { background: #f3f5fa; }
  h2.sec { font-size: 12.5pt; margin: 12px 0 4px; border-bottom: 1.5px solid #222; padding-bottom: 2px; break-after: avoid; }
  h2.sec .km { color: #2446a6; font-size: 11pt; }
  .book-cover { border: 1.5px solid #c8472e; border-radius: 4px; padding: 14px 16px; margin-bottom: 12px; }
  .book-cover h1 { font-family: "IBM Plex Sans Condensed", sans-serif; font-size: 22pt; }
  .book-cover .kmt { font-size: 15pt; font-weight: 700; color: #2446a6; }
  .toc { margin: 8px 0 0; padding-left: 20px; }
  footer.note { margin-top: 10px; font-size: 8pt; color: #666; }
</style>
<script>
  window.MathJax = {
    tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] },
    chtml: { fontURL: '/__mjfonts', scale: 1, mtextInheritFont: true },
    startup: { typeset: false },
  };
</script>
<script src="/__mj/tex-chtml.js"></script>
<script src="../js/engine.js"></script>
<script src="../js/khmer.js"></script>
<script src="../js/lessons.js"></script>
<script src="../js/lessons-km.js"></script>
</head>
<body>
<div id="out"></div>
<script>
(function () {
  'use strict';
  var E = window.CSCA, K = window.CSCA_KM, LES = window.CSCA_LESSONS, LKM = window.CSCA_LESSONS_KM;
  var L = 'ABCD';
  var qs = new URLSearchParams(location.search);
  var esc = function (s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); };
  // keep < > inside math from being read as HTML in authored HTML blocks
  var mathSafe = function (html) {
    return String(html).replace(/\\\(([\s\S]*?)\\\)|\\\[([\s\S]*?)\\\]/g, function (m) { return m.replace(/&(?![a-z]+;)/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); });
  };
  var MOD_KM = ['សំណុំ និង វិសមភាព', 'អនុគមន៍', 'ធរណីមាត្រ និង ពីជគណិត', 'ប្រូបាប និង ស្ថិតិ'];
  var SYL = {
    sets: ['Definition, operations, and representation of sets', 'និយមន័យ ប្រមាណវិធី និងការតំណាងសំណុំ'],
    ineq: ['Basic properties and solution methods of inequalities (e.g., quadratic and rational inequalities)', 'លក្ខណៈមូលដ្ឋាន និងវិធីដោះស្រាយវិសមភាព (ឧ. វិសមភាពដឺក្រេទីពីរ និងវិសមភាពប្រភាគ)'],
    func: ['Concepts and properties of functions (domain, range, monotonicity, parity, etc.)', 'គោលគំនិត និងលក្ខណៈនៃអនុគមន៍ (ដែនកំណត់ សំណុំតម្លៃ អថេរភាព ភាពគូ/សេស ។ល។)'],
    expolog: ['Basic elementary functions (power, exponential, logarithmic functions)', 'អនុគមន៍បឋមមូលដ្ឋាន (អនុគមន៍ស្វ័យគុណ អិចស្ប៉ូណង់ស្យែល លោការីត)'],
    trig: ['Basic elementary functions (trigonometric functions)', 'អនុគមន៍បឋមមូលដ្ឋាន (អនុគមន៍ត្រីកោណមាត្រ)'],
    seq: ['Sequences (general term formula and summation of arithmetic and geometric sequences)', 'ស្វ៊ីត (រូបមន្តតួទូទៅ និងផលបូកនៃស្វ៊ីតនព្វន្ត និងស្វ៊ីតធរណីមាត្រ)'],
    deriv: ['Basics of derivatives and calculus (definition, geometric meaning, and simple applications)', 'មូលដ្ឋានដេរីវេ និងគណនាវិភាគ (និយមន័យ អត្ថន័យធរណីមាត្រ និងការអនុវត្តសាមញ្ញ)'],
    lines: ['Plane analytic geometry (equations and properties of lines and circles)', 'ធរណីមាត្រវិភាគក្នុងប្លង់ (សមីការ និងលក្ខណៈនៃបន្ទាត់ និងរង្វង់)'],
    conics: ['Plane analytic geometry (ellipses, hyperbolas, and parabolas)', 'ធរណីមាត្រវិភាគក្នុងប្លង់ (អេលីប អ៊ីពែបូល និងប៉ារ៉ាបូល)'],
    vectors: ['Vectors and complex numbers (vector operations)', 'វ៉ិចទ័រ និងចំនួនកុំផ្លិច (ប្រមាណវិធីលើវ៉ិចទ័រ)'],
    complex: ['Vectors and complex numbers (basic operations of complex numbers)', 'វ៉ិចទ័រ និងចំនួនកុំផ្លិច (ប្រមាណវិធីមូលដ្ឋានលើចំនួនកុំផ្លិច)'],
    solid: ['Solid geometry (rectangular coordinate system in space and properties of simple solids)', 'ធរណីមាត្រលំហ (ប្រព័ន្ធកូអរដោនេកែងក្នុងលំហ និងលក្ខណៈនៃសូលីតសាមញ្ញ)'],
    prob: ['Classical probability model and probability calculation', 'គំរូប្រូបាបបុរាណ និងការគណនាប្រូបាប'],
    stats: ['Numerical characteristics of data (mean, variance, etc.)', 'លក្ខណៈលេខនៃទិន្នន័យ (មធ្យមភាគ វ៉ារ្យង់ ។ល។)'],
    normal: ['Basic concepts of normal distribution', 'គោលគំនិតមូលដ្ឋាននៃច្បាប់ណរម៉ាល់'],
  };

  function choiceTex(q, c) { return q.math ? esc('\\(' + c + '\\)') : esc(c); }
  function choiceCls(q) {
    var maxLen = Math.max.apply(null, q.choices.map(function (c) { return c.length; }));
    if (!q.math) return ' one';
    return maxLen < 16 ? '' : maxLen < 40 ? ' two' : ' one';
  }
  function question(q, no, heading) {
    var km = K.translate(q.q);
    var ch = q.choices.map(function (c, i) {
      var ckm = !q.math && K.translateChoice(c) ? '<span class="ckm km">' + esc(K.translateChoice(c)) + '</span>' : '';
      return '<span><b>' + L[i] + '.</b>' + choiceTex(q, c) + ckm + '</span>';
    }).join('');
    return '<div class="q"><p class="qn">' + (heading || 'Question') + ' ' + no + '</p>' +
      '<p><span class="label">English:</span>' + esc(q.q) + '</p>' +
      '<p class="km"><span class="label kl">ខ្មែរ:</span>' + esc(km) + '</p>' +
      '<div class="choices' + choiceCls(q) + '">' + ch + '</div></div>';
  }
  function answerList(list, startNo) {
    return list.map(function (q, i) {
      var c = q.choices[q.answer];
      var ckm = !q.math && K.translateChoice(c) ? ' <span class="km">(' + esc(K.translateChoice(c)) + ')</span>' : '';
      return '<div class="sol"><span class="ans">' + (startNo + i) + '. ' + L[q.answer] + '</span> — ' + choiceTex(q, c) + ckm + '<br><b>Solution / ដំណោះស្រាយ:</b> ' + esc(q.sol) + '</div>';
    }).join('');
  }

  /* ---------------- exam sheet ---------------- */
  function renderSheet(n) {
    var p = E.makeExamSheet(n);
    var h = '<header class="cover"><h1>Test for CSCA · Mathematics · Exam Sheet ' + n + '</h1>' +
      '<div class="kmt km">ការប្រឡងសាកល្បង CSCA · គណិតវិទ្យា · វិញ្ញាសាទី ' + n + '</div>' +
      '<div class="meta"><span>60 minutes / ៦០ នាទី</span><span>100 points / ១០០ ពិន្ទុ</span><span>48 questions / ៤៨ សំណួរ</span><span>Single choice / ជ្រើសចម្លើយត្រឹមត្រូវមួយ</span></div>' +
      '<div class="fields"><span>Name / ឈ្មោះ:</span><span>Class / ថ្នាក់:</span><span>Score / ពិន្ទុ:&nbsp;&nbsp;&nbsp;&nbsp;/100</span></div></header>' +
      '<ul class="instr"><li>Answer all 48 questions. Each question has exactly one correct answer. Mark your answers on the answer sheet. <span class="km">ឆ្លើយសំណួរទាំង ៤៨។ សំណួរនីមួយៗមានចម្លើយត្រឹមត្រូវតែមួយ។ សូមគូសចម្លើយលើសន្លឹកចម្លើយ។</span></li>' +
      '<li>This is a mock paper modelled on the CSCA Mathematics paper (2025 syllabus); it is not an official paper. <span class="km">នេះជាវិញ្ញាសាសាកល្បងតាមគំរូវិញ្ញាសា CSCA គណិតវិទ្យា មិនមែនជាវិញ្ញាសាផ្លូវការទេ។</span></li></ul>';
    var last = 0;
    p.questions.forEach(function (q) {
      if (q.module !== last) {
        last = q.module;
        h += '<h2 class="part">Part ' + q.module + ': ' + E.MODULES[q.module - 1].en + ' <span class="km">(' + MOD_KM[q.module - 1] + ')</span> - 12 Questions</h2>';
      }
      h += question(q, q.no);
    });
    var cols = ['', '', ''];
    for (var j = 0; j < 48; j++) cols[Math.floor(j / 16)] += '<div class="brow"><span class="n">' + (j + 1) + '</span><i>A</i><i>B</i><i>C</i><i>D</i></div>';
    h += '<section class="sheet"><h2>Answer sheet <span class="km">សន្លឹកចម្លើយ</span> · Exam Sheet ' + n + '</h2>' +
      '<div class="fields"><span>Name / ឈ្មោះ:</span><span>Class / ថ្នាក់:</span><span>Date / កាលបរិច្ឆេទ:</span></div>' +
      '<div class="bubbles"><div>' + cols[0] + '</div><div>' + cols[1] + '</div><div>' + cols[2] + '</div></div>' +
      '<p class="scale">Fill one circle per question. <span class="km">គូសរង្វង់តែមួយក្នុងមួយសំណួរ។</span></p>' +
      '<div class="scorebox"><div>Correct / ត្រូវ:</div><div>Wrong / ខុស:</div><div>Blank / មិនឆ្លើយ:</div><div>Score / ពិន្ទុ (/100):</div></div></section>';
    h += '<section class="key"><h2>Answer key <span class="km">ចម្លើយ</span> · Exam Sheet ' + n + '</h2>' +
      '<div class="grid">' + p.questions.map(function (q) { return '<div>' + q.no + '<b>' + L[q.answer] + '</b></div>'; }).join('') + '</div>' +
      '<p class="scale">Score = correct × 100 ÷ 48. <span class="km">ពិន្ទុ = ចំនួនត្រូវ × ១០០ ÷ ៤៨។</span> 24 → 50.0 · 30 → 62.5 · 36 → 75.0 · 40 → 83.3 · 44 → 91.7 · 48 → 100</p>' +
      answerList(p.questions, 1) + '</section>';
    return h;
  }

  /* ---------------- lesson book (one module) ---------------- */
  function renderLessons(m) {
    var mod = E.MODULES[m - 1];
    var lessons = LES.filter(function (l) { return l.module === m; });
    var h = '<div class="book-cover"><h1>Test for CSCA · Mathematics Lessons</h1><div class="kmt km">មេរៀនគណិតវិទ្យា CSCA</div>' +
      '<div class="meta"><span>Module ' + m + ': ' + mod.en + '</span><span class="km">ផ្នែកទី ' + m + '៖ ' + MOD_KM[m - 1] + '</span></div>' +
      '<p style="margin:8px 0 0">Each lesson follows the CSCA Mathematics Examination Syllabus (2025): key ideas in English with the Khmer translation, a worked example, exam tips, vocabulary, then 10 exercises in the style of the real paper with answers and solutions.</p>' +
      '<p class="km" style="margin:2px 0 0">មេរៀននីមួយៗធ្វើតាមកម្មវិធីសិក្សា CSCA (2025)៖ ខ្លឹមសារជាភាសាអង់គ្លេស និងការបកប្រែជាភាសាខ្មែរ ឧទាហរណ៍ គន្លឹះប្រឡង ពាក្យគន្លឹះ និងលំហាត់ ១០ តាមទម្រង់វិញ្ញាសាពិត ព្រមទាំងចម្លើយ និងដំណោះស្រាយ។</p>' +
      '<ol class="toc">' + lessons.map(function (l) { return '<li>' + esc(l.title) + ' — <span class="km">' + esc(LKM[l.id].title) + '</span></li>'; }).join('') + '</ol></div>';
    lessons.forEach(function (l) {
      var k = LKM[l.id];
      var idx = LES.indexOf(l) + 1;
      var syl = SYL[l.id];
      h += '<section class="lesson"><div class="lesson-head"><div class="num">LESSON ' + idx + ' · MODULE ' + m + '</div><h1>' + esc(l.title) + '</h1><div class="kmt km">មេរៀនទី ' + idx + '៖ ' + esc(k.title) + '</div></div>' +
        '<div class="syl"><b>Syllabus:</b> ' + m + '. ' + mod.en + ' — ' + esc(syl[0]) + '<br><span class="km"><b>កម្មវិធីសិក្សា៖</b> ' + m + '. ' + MOD_KM[m - 1] + ' — ' + esc(syl[1]) + '</span></div>' +
        '<p>' + mathSafe(l.summary) + '</p><p class="km">' + mathSafe(k.summary) + '</p>';
      l.blocks.forEach(function (b, i) {
        var kb = k.blocks[i];
        h += '<div class="pair"><div class="en-part"><h3>' + mathSafe(b.h) + '</h3>' + mathSafe(b.html) + '</div>' +
          '<div class="km-part km"><h3>' + mathSafe(kb.h) + '</h3>' + mathSafe(kb.html) + '</div></div>';
      });
      h += '<div class="pair"><div class="en-part"><h3>Worked example</h3><p>' + mathSafe(esc(l.example.q)) + '</p><ol>' + l.example.steps.map(function (s) { return '<li>' + mathSafe(s) + '</li>'; }).join('') + '</ol></div>' +
        '<div class="km-part km"><h3>ឧទាហរណ៍</h3><ol>' + k.example.map(function (s) { return '<li>' + mathSafe(s) + '</li>'; }).join('') + '</ol></div></div>';
      h += '<div class="pair"><div class="en-part"><h3>Exam tips</h3><ul>' + l.tips.map(function (t) { return '<li>' + mathSafe(t) + '</li>'; }).join('') + '</ul></div>' +
        '<div class="km-part km"><h3>គន្លឹះប្រឡង</h3><ul>' + k.tips.map(function (t) { return '<li>' + mathSafe(t) + '</li>'; }).join('') + '</ul></div></div>';
      h += '<div class="pair"><h3>Vocabulary <span class="km">ពាក្យគន្លឹះ</span></h3><table class="vocab"><tr><th>English</th><th>Meaning</th><th class="km">ខ្មែរ</th></tr>' +
        l.terms.map(function (t, i) { return '<tr><td>' + esc(t[0]) + '</td><td>' + esc(t[1]) + '</td><td class="km">' + esc(k.terms[i] || '') + '</td></tr>'; }).join('') + '</table></div>';
      var ex = E.practice(l.id, 10, 'csca-lesson-exercises-v1-' + l.id);
      h += '<h2 class="sec">Exercises <span class="km">លំហាត់</span> · ' + esc(l.title) + '</h2>' + ex.map(function (q, i) { return question(q, i + 1, 'Exercise'); }).join('');
      h += '<h2 class="sec">Answers <span class="km">ចម្លើយ</span></h2><div class="grid ten">' + ex.map(function (q, i) { return '<div>' + (i + 1) + '<b>' + L[q.answer] + '</b></div>'; }).join('') + '</div>' + answerList(ex, 1) + '</section>';
    });
    return h;
  }

  var doc = qs.get('doc');
  var out = document.getElementById('out');
  if (doc === 'sheet') out.innerHTML = renderSheet(Number(qs.get('n') || 1));
  else out.innerHTML = renderLessons(Number(qs.get('module') || 1));
  MathJax.startup.promise.then(function () { return MathJax.typesetPromise(); }).then(function () { return document.fonts.ready; }).then(function () { window.__done = true; });
})();
</script>
